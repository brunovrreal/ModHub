<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrunoVR Homepage</title>
    <style>
        :root {
            --beat-glow: 0px;
            --beat-color-pulse: #24103d;
        }

        body {
            background-color: var(--beat-color-pulse);
            background-image: radial-gradient(circle at center, rgba(180, 80, 255, 0.20) 0%, transparent 80%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        canvas#lightning-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .main-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: blur(20px);
            transition: filter 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
            position: relative;
            z-index: 2;
        }

        .main-content.active {
            filter: blur(0px);
            pointer-events: auto;
        }

        .enter-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(25, 10, 40, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .enter-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .enter-text {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(190, 90, 255, 0.9), 
                         0 0 30px rgba(190, 90, 255, 0.5);
            animation: pulseText 2s infinite ease-in-out;
        }

        @keyframes pulseText {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border: 5px solid #b84cff;
            box-shadow: 0 0 calc(20px + var(--beat-glow)) rgba(184, 76, 255, 0.6);
            margin-bottom: 20px;
            border-radius: 50%;
        }

        .title-container {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .typewriter-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 calc(15px + var(--beat-glow)) rgba(184, 76, 255, 0.8), 
                         0 0 calc(30px + var(--beat-glow)) rgba(184, 76, 255, 0.5);
            letter-spacing: 2px;
            border-right: 3px solid #b84cff;
            white-space: nowrap;
            background: transparent;
            padding-right: 4px;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #b84cff; }
        }

        .links-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .card-link {
            background: linear-gradient(135deg, #16161f 0%, #1f1f2e 100%);
            border: 1px solid #33334d;
            border-radius: 12px;
            padding: 15px 20px;
            text-decoration: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            transition: all 0.1s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card-link:hover {
            transform: translateY(-3px);
            border-color: #b84cff;
            box-shadow: 0 6px 25px rgba(184, 76, 255, 0.5);
        }

        .btn-name {
            font-size: 1.25rem;
            font-weight: bold;
            color: #c66cff;
            margin-bottom: 5px;
        }

        .btn-description {
            font-size: 0.9rem;
            color: #b0b0bc;
            line-height: 1.4;
        }

        /* Subscription Required Block Module */
        .sub-locker {
            background: linear-gradient(135deg, #121218 0%, #171724 100%);
            border: 2px solid #b84cff;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 35px rgba(184, 76, 255, 0.35);
            max-width: 440px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 40px;
            display: none;
        }

        .sub-locker h3 {
            color: #ffffff;
            margin-top: 0;
            font-size: 1.6rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 17, 17, 0.6);
        }

        .sub-locker p {
            color: #b0b0bc;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .locker-btn {
            background: #b84cff;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: block;
            transition: all 0.2s ease;
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(184, 76, 255, 0.2);
        }

        .locker-btn:hover {
            background: #e60000;
            transform: translateY(-1px);
        }

        .locker-btn.verify-btn {
            background: #20202c;
            border: 1px solid #3d3d5c;
            color: #e0e0eb;
            box-shadow: none;
        }

        .locker-btn.verify-btn:hover {
            background: #272736;
            border-color: #b84cff;
        }
        
        .error-msg {
            color: #c66cff;
            font-size: 0.85rem;
            margin-top: -5px;
            margin-bottom: 15px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <canvas id="lightning-canvas"></canvas>
    <audio id="bg-audio" crossorigin="anonymous" preload="auto" style="display:none;"></audio>

    <div class="enter-overlay" id="overlay-screen">
        <div class="enter-text" id="enter-status">Click to Enter...</div>
    </div>

    <div class="main-content" id="site-content">
        <img src="151.png" alt="BrunoVR Profile Picture" class="profile-pic">

        <div class="title-container">
            <div class="typewriter-text" id="typewriter"></div>
        </div>

        <div class="sub-locker" id="subscription-modal">
            <h3>ATTENTION</h3>
            <p>Please Subscribe to my channel before continuing to my site.</p>
            <a href="https://youtube.com/@Real_Bruno_VR?sub_confirmation=1" target="_blank" class="locker-btn" id="subscribe-action-btn">1. Subscribe on YouTube</a>
            <div class="error-msg" id="locker-error">Please complete step 1 before checking status!</div>
            <button class="locker-btn verify-btn" id="verify-action-btn">2. Check Verification</button>
        </div>

        <div class="links-container" id="menu-links">
            <a href="Oldest%20Company.apk" class="card-link" download>
                <span class="btn-name">Old Animal Company</span>
                <span class="btn-description">Download the Old Animal Company APK</span>
            </a>
        </div>
    </div>

    <script>
        const textArray = ["BrunoVR"];
        let textIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typeSpeed = 150;  
        const eraseSpeed = 100; 
        const delayBetween = 2500; 
        const typewriterElement = document.getElementById("typewriter");

        function type() {
            const currentText = textArray[textIndex];
            if (isDeleting) {
                typewriterElement.textContent = currentText.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typewriterElement.textContent = currentText.substring(0, charIndex + 1);
                charIndex++;
            }

            let nextActionSpeed = isDeleting ? eraseSpeed : typeSpeed;

            if (!isDeleting && charIndex === currentText.length) {
                nextActionSpeed = delayBetween; 
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                nextActionSpeed = 500; 
            }
            setTimeout(type, nextActionSpeed);
        }

        const canvas = document.getElementById('lightning-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let lightningOpacity = 0;
        let activeStrikes = [];

        function createLightningPath(startX, startY, endY, segments) {
            let path = [{x: startX, y: startY}];
            let currentX = startX;
            let currentY = startY;
            let segmentHeight = (endY - startY) / segments;

            for (let i = 0; i < segments; i++) {
                currentY += segmentHeight;
                let deviation = (Math.random() - 0.5) * 110; 
                currentX += deviation;
                path.push({x: currentX, y: currentY});
            }
            return path;
        }

        function drawLightning(path, width, glowSize, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.shadowBlur = glowSize;
            ctx.shadowColor = '#b84cff';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();
        }

        function triggerLightningStrike() {
            activeStrikes = [];
            let totalStrikes = Math.floor(Math.random() * 3) + 2; 

            for (let i = 0; i < totalStrikes; i++) {
                let startX = Math.random() * canvas.width;
                let path = createLightningPath(startX, 0, canvas.height, 10);
                activeStrikes.push(path);
            }
            lightningOpacity = 1.0; 
        }

        let audioCtx, analyser, dataArray, sourceNode;
        let isPlaying = false;
        const audio = document.getElementById('bg-audio');
        
        const songUrl = 'Jane!.mp3';

        let bassHistory = [];
        const historySize = 20; 
        let lastStrikeTime = 0;

        function setupAndPlayAudio() {
            try {
                audio.src = songUrl;
                audio.loop = true;
                audio.crossOrigin = "anonymous";

                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64; 
                
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                sourceNode = audioCtx.createMediaElementSource(audio);
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                audio.currentTime = 7;

                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isPlaying = true;
                        animateDance();
                    }).catch(err => {
                        console.error("Playback failed directly:", err);
                        audio.src = 'Jane!.mp3';
                        audio.play().then(() => { isPlaying = true; animateDance(); });
                    });
                }

            } catch (err) {
                console.error("Audio initialization glitch:", err);
            }
        }

        function animateDance() {
            requestAnimationFrame(animateDance);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!isPlaying) return;

            analyser.getByteFrequencyData(dataArray);
            let bassValue = (dataArray[0] + dataArray[1] + dataArray[2] + dataArray[3]) / 4;

            let sum = 0;
            for (let i = 0; i < bassHistory.length; i++) {
                sum += bassHistory[i];
            }
            let bassAverage = bassHistory.length > 0 ? sum / bassHistory.length : 120;

            bassHistory.push(bassValue);
            if (bassHistory.length > historySize) {
                bassHistory.shift();
            }

            let currentTime = Date.now();
            let timeSinceLastStrike = currentTime - lastStrikeTime;

            if ((bassValue > bassAverage * 1.04 && timeSinceLastStrike > 180) || (bassValue >= 240 && timeSinceLastStrike > 320)) {
                triggerLightningStrike();
                lastStrikeTime = currentTime;
            }

            if (lightningOpacity > 0) {
                ctx.globalAlpha = lightningOpacity;
                activeStrikes.forEach(path => {
                    drawLightning(path, 5, 35, '#c66cff');
                    drawLightning(path, 1.5, 5, '#ffffff');
                });
                lightningOpacity *= 0.75; 
                if (lightningOpacity < 0.01) lightningOpacity = 0;
            }

            let normalized = bassValue / 255;
            let glowIntensity = normalized * 50; 
            let redShift = Math.floor(13 + (lightningOpacity * 35)); 
            let colorPulse = `rgb(${redShift}, 13, 17)`;

            document.documentElement.style.setProperty('--beat-glow', `${glowIntensity}px`);
            document.documentElement.style.setProperty('--beat-color-pulse', colorPulse);
        }

        let clickedSubscribe = false;

        function checkLayoutLock() {
            const container = document.getElementById('menu-links');
            const modal = document.getElementById('subscription-modal');
            const subBtn = document.getElementById('subscribe-action-btn');
            const verifyBtn = document.getElementById('verify-action-btn');
            const errorMsg = document.getElementById('locker-error');

            const hasVisitedBefore = localStorage.getItem('brunovr_visited');

            if (!hasVisitedBefore) {
                // If it's the first visit, hide the links, reveal the inline block box module
                container.style.display = 'none';
                modal.style.display = 'block';

                subBtn.addEventListener('click', () => {
                    clickedSubscribe = true;
                    errorMsg.style.display = 'none';
                });

                verifyBtn.addEventListener('click', () => {
                    if (!clickedSubscribe) {
                        errorMsg.style.display = 'block';
                    } else {
                        localStorage.setItem('brunovr_visited', 'true');
                        modal.style.display = 'none';
                        container.style.display = 'flex';
                    }
                });
            } else {
                // Return users bypass the gate and see the standard menu directly
                modal.style.display = 'none';
                container.style.display = 'flex';
            }
        }

        const overlay = document.getElementById('overlay-screen');
        const siteContent = document.getElementById('site-content');
        const enterStatus = document.getElementById('enter-status');

        overlay.addEventListener('click', () => {
            enterStatus.textContent = "Loading Track...";
            overlay.classList.add('hidden');
            siteContent.classList.add('active');

            setupAndPlayAudio();
            checkLayoutLock();
        });

        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(type, 500);
        });
    </script>
</body>
</html>
